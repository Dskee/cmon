[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmon"
version = "0.1.0"
description = "可控的电商商品与竞品监控调度器：三层限流、三层去重、五态状态机、故障注入可复现"
requires-python = ">=3.11"
dependencies = []

# 核心链路零依赖，这三组都是加装的
[project.optional-dependencies]
ui = ["gradio>=6.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6.0", "httpx>=0.27"]

[project.scripts]
cmon = "cmon.cli:main"

[tool.setuptools]
packages = ["cmon", "cmon.collect", "cmon.normalize", "cmon.judge",
            "cmon.analyze", "cmon.output", "cmon.mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]